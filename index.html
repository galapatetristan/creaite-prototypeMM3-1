      <div class="container hero-center">
        <p class="eyebrow">CreAIte — Create with AI</p>
        <h1 class="hero-title">What do you want to create today?</h1>
        <p class="lead">
          Generate marketing designs, captions, UI/UX website layouts, and short video edits — then refine with your brand kit.
        </p>

        <div class="prompt-shell">
          <div class="prompt-row">
            <button class="tool-pill is-active" data-tool="prompt" type="button">Prompt</button>
            <button class="tool-pill" data-tool="brand" type="button">Brand kit</button>
            <button class="tool-pill" data-tool="templates" type="button">Templates</button>
          </div>

          <form class="prompt-box" id="promptForm">
            <input id="promptInput" type="text" placeholder="Example: Make a caption about Filipino adobo for my cooking show." autocomplete="off" />
            <button class="btn" type="submit" id="generateBtn">Generate</button>
          </form>

          <div class="suggestions">
            <button class="chip chip-action" type="button" data-suggest="Make a caption about Filipino adobo for my cooking show.">Adobo cooking</button>
            <button class="chip chip-action" type="button" data-suggest="Write a caption + hashtag set for a new milktea flavor launch.">Cafe promo</button>
            <button class="chip chip-action" type="button" data-suggest="Generate 3 ad variations for a small clothing brand — streetwear drop.">Ad variations</button>
            <button class="chip chip-action" type="button" data-suggest="Design a UI/UX website landing page for a small business — sections + short copy.">UI/UX website</button>
            <button class="chip chip-action" type="button" data-suggest="Edit my raw video into a 15-second promo reel (cut highlights + captions).">AI video edit</button>
          </div>

              <span class="badge">Result</span>
              <span class="muted" id="landingStatus">Ready</span>
            </div>
